// ---------------------------------------------------------------------------
// Recommended emulator AVD: Pixel 9 - API 36 (Android 16, Google Play image).
// The AVD tracks targetSdk (36), not compileSdk.
//
// compileSdk 37: forced by permission_handler_android 14, whose AAR metadata
//   requires consumers to compile against API 37 or later.
// targetSdk 36: matches the Android toolchain bundled with Flutter 3.44.9
//   (flutter_tools/lib/src/android/gradle_utils.dart: targetSdkVersion = '36'),
//   so the app does not opt in to Android 17 runtime behaviour changes.
//   Raising compileSdk independently of targetSdk is supported by AGP.
// minSdk 24: the Flutter engine floor (gradle_utils.dart minSdkVersionInt).
//
// Toolchain is held at Flutter 3.44.9's validated ceiling:
// Gradle 9.3.1, AGP 9.1.1, Kotlin 2.3.20.
// ---------------------------------------------------------------------------
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load secrets from local.properties, which is not in version control.
// No credential is allowed to live in this file.
def facebookAppId = localProperties.getProperty('facebook.app.id') ?: ''
def facebookClientToken = localProperties.getProperty('facebook.client.token') ?: ''
def googleApiKey = localProperties.getProperty('google.api.key') ?: ''

// Signing key. The store and key share one password, as generated by keytool.
// Google and Facebook sign-in are registered against the SHA-1 of mykey.jks,
// so the release build must keep using it rather than the default debug key.
def keystorePassword = localProperties.getProperty('keystore.password') ?: ''
def keystoreKeyAlias = localProperties.getProperty('keystore.key.alias') ?: 'androiddebugkey'

// Gradle 9 deprecates the Groovy "space assignment" DSL (`propName value`);
// it is removed in Gradle 10, so every property below uses `=` assignment.
android {
    namespace = "com.example.ebooking"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // `kotlinOptions` is deprecated in KGP 2.x — see the `kotlin { }` block below.

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Registered with Google and Facebook; changing it breaks both sign-in flows.
        applicationId = "com.example.ebooking"
        // 24 is the Flutter engine floor; no upgraded plugin requires higher.
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        
        // Securely inject API keys into BuildConfig
        buildConfigField "String", "FACEBOOK_APP_ID", "\"${facebookAppId}\""
        buildConfigField "String", "FACEBOOK_CLIENT_TOKEN", "\"${facebookClientToken}\""
        buildConfigField "String", "GOOGLE_API_KEY", "\"${googleApiKey}\""
        
        // Make available to AndroidManifest.xml.
        // Must be putAll, not `=`: the Flutter Gradle plugin injects the
        // `applicationName` placeholder that AndroidManifest.xml relies on, and
        // reassigning the map drops it ("requires a placeholder substitution
        // but no value for <applicationName> is provided").
        manifestPlaceholders.putAll([
            facebookAppId: facebookAppId,
            facebookClientToken: facebookClientToken,
            googleApiKey: googleApiKey
        ])
    }

    signingConfigs {
        debug {
            keyAlias = keystoreKeyAlias
            keyPassword = keystorePassword
            storeFile = file('mykey.jks')
            storePassword = keystorePassword
        }
    }

    buildTypes {
        release {
            // Release deliberately reuses the debug signing config: Google and
            // Facebook have the SHA-1 of mykey.jks registered, and signing the
            // release with any other key would break both sign-in flows.
            signingConfig = signingConfigs.debug

            // Enable code obfuscation and optimization
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

dependencies {
    // The Facebook Android SDK comes in through the flutter_facebook_auth plugin,
    // which pins a concrete version. Declaring facebook-login here a second time,
    // and with a dynamic `latest.release` version, made the build unreproducible.
}
