name: ebooking_desktop
description: "eBooking — administrative desktop client (Windows)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.2.1
  fl_chart: 0.68.0
  flutter_secure_storage: ^9.2.2
  signalr_core: ^1.1.2
  provider: ^6.1.2
  intl: ^0.20.2

  # Nocturne redesign: ikonski set (design system readme.md -> "Use Phosphor icons").
  # NAPOMENA: koristi se `phosphor_icons` fork, NE originalni `phosphor_flutter`.
  # phosphor_flutter-ov PhosphorIconData nasljeđuje IconData, što je prestalo
  # kompajlirati kad je Flutter 3.44 označio IconData kao `final`. Fork ima
  # identičan API ali ne nasljeđuje IconData. Isti paket koristi i mobilni klijent.
  phosphor_icons: ^3.0.1

  # Modul za izvještavanje (Upute 2.2 — minimalno dva .pdf izvještaja,
  # dostupna za preuzimanje i ispis).
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
