services:
  webapi:
    build:
      context: .
      dockerfile: ebooking-api/API/Dockerfile 
    env_file:
      - .env
    environment:
      - DB_SERVER=$DB_SERVER
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - JWT_KEY=$JWT_KEY
      - JWT_ISSUER=$JWT_ISSUER
      - JWT_AUDIENCE=$JWT_AUDIENCE
    ports:
      - 9999:8080
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  messenger:
    build:
      context: .
      dockerfile: ebooking-api/Messenger/Dockerfile
    env_file:
      - .env
    environment:
      - DB_SERVER=$DB_SERVER
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - JWT_KEY=$JWT_KEY
      - JWT_ISSUER=$JWT_ISSUER
      - JWT_AUDIENCE=$JWT_AUDIENCE
    ports:
      - 8888:8080
    depends_on:
      db:
        condition: service_healthy
      webapi:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  paymentapp:
    build:
      context: .
      dockerfile: ebooking-api/PaymentApp/Dockerfile
    env_file:
      - .env
    environment:
      - DB_SERVER=$DB_SERVER
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - JWT_KEY=$JWT_KEY
      - JWT_ISSUER=$JWT_ISSUER
      - JWT_AUDIENCE=$JWT_AUDIENCE
      - PAYPAL_CLIENT_ID=$PAYPAL_CLIENT_ID
      - PAYPAL_SECRET_KEY=$PAYPAL_SECRET_KEY
      - PAYPAL_ENV=$PAYPAL_ENV
    ports:
      - 9090:8080
    depends_on:
      db:
        condition: service_healthy
      webapi:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    expose:
      - 5672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  db:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR10-ubuntu-20.04
    platform: linux/amd64
    ports:
      - "7777:1433"
    env_file:
      - .env
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - ACCEPT_EULA=Y
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart:
      unless-stopped
volumes:
  mssql_data:

